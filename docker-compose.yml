services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bloodapp
      POSTGRES_USER: bloodapp
      POSTGRES_PASSWORD: bloodapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodapp -d bloodapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bloodapp:bloodapp@db:5432/bloodapp
      SECRET_KEY: ${SECRET_KEY:-change-this-development-key-before-deploying}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
